name: CI - Exam Service

on:

  push:
    branches: [ main ]
    paths:
      - 'exam-service/**'

  pull_request:
    branches: [ main ]
    paths:
      - 'exam-service/**'

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: exam-service

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: exam-service/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier la syntaxe du code
        run: node -c server.js

      - name: Construire l'image Docker
        run: docker build -t exam-service:ci .

      - name: Confirmation
        run: echo "Le build et les vérifications de exam-service ont réussi !"


      - name: Connexion à Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
 
      - name: Construire et publier l'image
        if: github.ref == 'refs/heads/main'
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/exam-service
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          docker build -t $IMAGE_NAME:latest -t $IMAGE_NAME:$SHORT_SHA .
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:$SHORT_SHA
 
      - name: Confirmation du CD
        if: github.ref == 'refs/heads/main'
        run: echo "🚀 Image publiée avec succès sur Docker Hub !"