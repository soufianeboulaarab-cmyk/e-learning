name: CI - Exam Service

on:

  push:
    branches: [ main ]
    paths:
      - 'exam-service/**'

  pull_request:
    branches: [ main ]
    paths:
      - 'exam-service/**'

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: exam-service

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: exam-service/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier la syntaxe du code
        run: node -c server.js

      - name: Construire l'image Docker
        run: docker build -t exam-service:ci .

      - name: Confirmation
        run: echo "✅ Le build et les vérifications de exam-service ont réussi !"