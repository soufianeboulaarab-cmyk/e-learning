# 1. Le bloc "events" est obligatoire dans tout fichier de config Nginx,
#    même vide de fonctionnalités avancées ici. Il configure la gestion
#    bas niveau des connexions réseau (nombre max de connexions simultanées, etc.).
events {
    worker_connections 1024;
}

# 2. Le bloc "http" contient toute la configuration liée au trafic HTTP
http {

    # 3. Un bloc "server" représente UN serveur virtuel.
    #    CELUI-CI écoute en HTTP simple (port 80) — on va le transformer en simple
    #    redirection automatique vers HTTPS, pour forcer la sécurité.
    server {
        listen 80;

        # 8. Toute requête arrivant en HTTP est immédiatement redirigée vers HTTPS.
        #    "$request_uri" garde l'URL demandée (ex: /api/exam/health) intacte
        #    dans la redirection, on ne renvoie pas juste vers la racine.
        #    "301" = redirection permanente (bonne pratique SEO/HTTP standard).
        return 301 https://$host$request_uri;
    }

    # 9. NOUVEAU bloc "server" : celui-ci gère le VRAI trafic, en HTTPS, port 443
    #    (le port standard pour HTTPS, comme 80 l'est pour HTTP).
    server {
        listen 443 ssl;

        # 10. Chemins vers le certificat et la clé privée, À L'INTÉRIEUR DU CONTENEUR
        #     (on va les monter au même endroit que ce chemin, dans docker-compose.yml).
        ssl_certificate     /etc/nginx/certs/certificate.crt;
        ssl_certificate_key /etc/nginx/certs/private.key;

        # 11. On restreint aux versions modernes et sécurisées du protocole TLS.
        ssl_protocols TLSv1.2 TLSv1.3;

        # ============================================================
        # ROUTES VERS CHAQUE MICROSERVICE (identiques à avant, juste
        # déplacées dans ce bloc "server" HTTPS)
        # ============================================================

        location /api/exam/ {
            proxy_pass http://exam-service:3001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/users/ {
            proxy_pass http://user-service:3002/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/courses/ {
            proxy_pass http://course-service:3003/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/quiz/ {
            proxy_pass http://quiz-service:3004/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/progress/ {
            proxy_pass http://progress-service:3005/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /health {
            return 200 '{"status":"UP","service":"api-gateway"}';
            add_header Content-Type application/json;
        }
    }
}